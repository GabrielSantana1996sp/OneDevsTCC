name: Build OneDevsOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest  # Runner base do GitHub
    
    timeout-minutes: 120
    
    env:
      ISO_NAME: "onedevsos-alberteinstein-1.0-amd64.iso"
      DRIVE_FOLDER_ID: "1DFmwsZE9mg2PAwCHkWP3b9_YMvWlWrxN"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build da ISO (em Container Debian Trixie)
        # Roda o script dentro de um container Debian fresco
        run: |
          docker run --rm -v $PWD:/workdir -w /workdir debian:trixie-slim bash -c "
            apt-get update && apt-get install -y sudo curl git
            chmod +x Script_ISO
            ./Script_ISO
          "
          
      - name: Verificar ISO Gerada
        run: |
          if [ ! -f "${{ env.ISO_NAME }}" ]; then
            echo " Erro: ISO não foi gerada."
            exit 1
          fi
          ls -lh ${{ env.ISO_NAME }}

      - name: Upload para Google Drive
        if: success()
        run: |
          echo " Enviando para Google Drive..."
          # ATENÇÃO: gsutil é para Google Cloud Storage (GCS), não Google Drive.
          # Se você realmente quer Google Drive, precisa usar a API do Drive ou rclone.
          # Exemplo hipotético se você estiver usando GCS:
          # gsutil cp ${{ env.ISO_NAME }} "gs://seu-bucket/${{ env.DRIVE_FOLDER_ID }}/"
          
          echo " Aviso: O comando gsutil acima não funciona para Google Drive pessoal."
          echo "Para Google Drive, use a ação 'google-github-actions/upload-drive' ou rclone."

      - name: Resumo
        run: |
          echo "##  Build Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **ISO**: ${{ env.ISO_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Drive**: [Abrir pasta](https://drive.google.com/drive/folders/${{ env.DRIVE_FOLDER_ID }})" >> $GITHUB_STEP_SUMMARY
