name: Build OneDevsOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    timeout-minutes: 120
    
    env:
      ISO_NAME: "onedevsos-alberteinstein-1.0-amd64.iso"
      DRIVE_FOLDER_ID: "1DFmwsZE9mg2PAwCHkWP3b9_YMvWlWrxN"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build da ISO (em Container Debian Trixie)
        run: |
          docker run --rm -v $PWD:/workdir -w /workdir debian:trixie-slim bash -c "
            apt-get update && apt-get install -y sudo curl git live-build debootstrap xorriso squashfs-tools genisoimage
            chmod +x Script_ISO
            export CI=true
            ./Script_ISO
          "

      - name: Verificar ISO Gerada
        run: |
          if [ ! -f "${{ env.ISO_NAME }}" ]; then
            echo " Erro: ISO não foi gerada."
            exit 1
          fi
          ls -lh ${{ env.ISO_NAME }}

      - name: Upload para Google Drive
        if: success()
        run: |
          echo " Enviando para Google Drive..."
          # NOTA: gsutil é para Google Cloud Storage (GCS), não Google Drive pessoal.
          # Para Google Drive pessoal, configure rclone ou use a API do Drive.
          echo " Aviso: Upload real para Google Drive pessoal requer rclone/API."

      - name: Resumo
        run: |
          echo "##  Build Concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **ISO**: ${{ env.ISO_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Drive**: [Abrir pasta](https://drive.google.com/drive/folders/${{ env.DRIVE_FOLDER_ID }})" >> $GITHUB_STEP_SUMMARY
