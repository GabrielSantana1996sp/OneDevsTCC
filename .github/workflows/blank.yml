name: Build OneDevsOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    timeout-minutes: 120
    
    env:
      ISO_NAME: "onedevsos-alberteinstein-1.0-amd64.iso"
      DRIVE_FOLDER_ID: "1DFmwsZE9mg2PAwCHkWP3b9_YMvWlWrxN"
      GCS_BUCKET: "onedevsos-bucket"  # Substitua pelo seu bucket GCS
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build da ISO (em Container Debian Trixie)
        run: |
          docker run --rm \
            -v $PWD:/workdir \
            -w /workdir \
            --security-opt seccomp=unconfined \
            debian:trixie-slim bash -c "
              set -e
              
              # Instalação das dependências
              apt-get update
              apt-get install -y \
                sudo \
                curl \
                git \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                genisoimage \
                rclone \
                fakeroot \
                binutils \
                bzip2 \
                gzip \
                xz-utils \
                lzop \
                zstd \
                rsync \
                parted \
                mtools \
                dosfstools \
                syslinux \
                syslinux-common \
                isolinux \
                grub-pc-bin \
                grub-efi-amd64-bin \
                efibootmgr \
                mtools \
                zip \
                unzip \
                wget \
                ca-certificates \
                gnupg \
                lsb-release \
                software-properties-common \
                apt-transport-https \
                apt-utils \
                locales \
                locales-all \
                tzdata \
                netbase \
                net-tools \
                iputils-ping \
                dnsutils \
                ca-certificates \
                openssl \
                libssl-dev \
                libcurl4-openssl-dev \
                libgnutls28-dev \
                libgcrypt20-dev \
                libgpg-error-dev \
                libpcre3-dev \
                libreadline-dev \
                libncurses5-dev \
                libncursesw5-dev \
                libsqlite3-dev \
                libxml2-dev \
                libxslt1-dev \
                zlib1g-dev \
