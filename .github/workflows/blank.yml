name: Build OneDevsOS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    
    timeout-minutes: 120
    
    env:
      ISO_NAME: "onedevsos-alberteinstein-1.0-amd64.iso"
      GCS_BUCKET: "GCS_BUCKET: "onedevs-ci-upload-bucket"
      DRIVE_FOLDER_ID: "1DFmwsZE9mg2PAwCHkWP3b9_YMvWlWrxN" # Mantido caso queira usar API depois
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build da ISO (Container Limpo)
        run: |
          docker run --rm \
            -v $PWD:/workdir \
            -w /workdir \
            debian:trixie-slim bash -c '
              set -e
              
              # Atualiza e instala apenas o essencial para live-build
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                debootstrap \
                xorriso \
                squashfs-tools \
                genisoimage \
                curl \
                git \
                sudo \
                rsync \
                parted \
                mtools \
                dosfstools \
                syslinux \
                syslinux-common \
                grub-pc-bin \
                grub-efi-amd64-bin \
                efibootmgr
                
              # Prepara e executa o script
              chmod +x Script_ISO
              export CI=true
              echo "Iniciando build da ISO..."
              ./Script_ISO
            '

      - name: Verificar ISO Gerada
        run: |
          if [ ! -f "${{ env.ISO_NAME }}" ]; then
            echo "❌ Erro crítico: A ISO não foi gerada."
            ls -la
            exit 1
          fi
          SIZE=$(stat -c%s ${{ env.ISO_NAME }})
          echo "✅ ISO gerada com sucesso!"
          echo "📦 Nome: ${{ env.ISO_NAME }}"
          echo "📏 Tamanho: $(numfmt --to=iec-i --suffix=B $SIZE)"
          echo "ISO_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Upload para Google Cloud Storage (GCS)
        if: success()
        run: |
          echo "🚀 Enviando ISO para o Bucket GCS..."
          gsutil cp ${{ env.ISO_NAME }} gs://${{ env.GCS_BUCKET }}/
          echo "✅ Upload concluído!"
          echo "Link: https://console.cloud.google.com/storage/browser/${{ env.GCS_BUCKET }}/${{ env.ISO_NAME }}"

      - name: Resumo do Build
        run: |
          echo "## 🎉 Build Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Detalhe |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Nome da ISO** | \`${{ env.ISO_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamanho** | $(numfmt --to=iec-i --suffix=B ${{ env.ISO_SIZE }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Armazenamento** | [Ver no GCS](https://console.cloud.google.com/storage/browser/${{ env.GCS_BUCKET }}/${{ env.ISO_NAME }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Nota: O upload para o Google Drive pessoal foi substituído por GCS para maior estabilidade no CI." >> $GITHUB_STEP_SUMMARY
